<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pagina non trovata, Mattia Agostoni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Instrument+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
.nf{min-height:100vh;display:grid;align-content:center;justify-items:start;gap:28px;padding:0 5vw}
.nfk{font:900 clamp(6rem,26vw,24rem)/.8 var(--d);color:transparent;-webkit-text-stroke:2px var(--w);animation:up 1.1s cubic-bezier(.16,1,.3,1) both}
.nf h1{font-size:clamp(2.2rem,7vw,6rem);line-height:.95;transform:none;animation:up 1.1s .15s cubic-bezier(.16,1,.3,1) both}
.nfb{display:inline-flex;align-items:center;padding:14px 28px;border:1px solid var(--w);border-radius:99px;text-decoration:none;font-weight:600;color:inherit;transition:background .3s,color .3s}
.nfb:hover{background:var(--w);color:var(--k)}
</style>
</head>
<body>
<main class="nf">
  <p class="nfk">404</p>
  <h1>Questa pagina non esiste. I miei lavori sì.</h1>
  <a class="nfb" href="/">Torna alla home</a>
</main>
</body>
</html>
